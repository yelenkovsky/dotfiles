name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning
